name: Build mangosd (SPP Classics WotLK + Renown)

# Rebuilds the server version SPP Classics V2 ships for WotLK (celguar/mangos-wotlk ike3-bots 188c9b6, 2024-05-20)
# with the same modules (immersive, hardcore, transmog), plus the Renown module from this repository.
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'cmangos-renown/**'
      - 'patches/wotlk/**'
      - '.github/workflows/build-windows-wotlk.yml'

env:
  BUILD_TYPE: RelWithDebInfo
  BOOST_VERSION: "1.86.0"
  BOOST_TOOLSET: "msvc"
  CORE_REPO: celguar/mangos-wotlk
  CORE_SHA: 188c9b601941e2ce20e2db76a2a7dfe11c51163b
  PLAYERBOTS_SHA: a00394d5d696ac925e8d08a339cd725d05efe0b2
  MODULES_SHA: 7cf34c40b16feecb468f3e1256bdefce58510a72
  BUILD_OPTIONS: >-
    -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=TRUE -DBUILD_EXTRACTORS=OFF -DBUILD_PLAYERBOTS=ON -DBUILD_AHBOT=ON
    -DBUILD_GIT_ID=ON -DBUILD_MODULES=ON -DBUILD_MODULE_IMMERSIVE=ON -DBUILD_MODULE_HARDCORE=ON
    -DBUILD_MODULE_TRANSMOG=ON -DBUILD_MODULE_RENOWN=ON

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - name: Keep LF line endings (so the server patches apply cleanly)
        run: git config --global core.autocrlf false

      - name: Checkout this repository (Renown module)
        uses: actions/checkout@v4
        with:
          path: renown-repo

      - name: Checkout server core (pinned)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CORE_REPO }}
          ref: ${{ env.CORE_SHA }}
          path: core

      # The 2024 core adds modules from src/modules/<name>, so every module is checked out there directly
      - name: Checkout playerbots (pinned)
        uses: actions/checkout@v4
        with:
          repository: cmangos/playerbots
          ref: ${{ env.PLAYERBOTS_SHA }}
          path: core/src/modules/playerbots

      - name: Checkout module framework (pinned)
        uses: actions/checkout@v4
        with:
          repository: davidonete/cmangos-modules
          ref: ${{ env.MODULES_SHA }}
          path: deps/modules

      - { name: immersive, uses: actions/checkout@v4, with: { repository: flekz-games/cmangos-immersive, ref: 1999c25ef1ce8a12e855187a7b8d3dabcbf8cf0a, path: core/src/modules/immersive } }
      - { name: hardcore, uses: actions/checkout@v4, with: { repository: flekz-games/cmangos-hardcore, ref: 48af54d8a0127931fec8b9fbb894ebbfcb5e738b, path: core/src/modules/hardcore } }
      - { name: transmog, uses: actions/checkout@v4, with: { repository: flekz-games/cmangos-transmog, ref: 4b2acd4cc0fe43a34a59f00c0adf94d2b7f88783, path: core/src/modules/transmog } }

      - name: Apply server patches
        shell: bash
        run: |
          git -C core apply --whitespace=nowarn "$GITHUB_WORKSPACE/renown-repo/patches/wotlk/core.patch"
          git -C core/src/modules/playerbots apply --whitespace=nowarn "$GITHUB_WORKSPACE/renown-repo/patches/wotlk/playerbots.patch"
          git -C deps/modules apply --whitespace=nowarn "$GITHUB_WORKSPACE/renown-repo/patches/wotlk/modules.patch"
          grep -n "OnPreBuyItem" deps/modules/src/Module.h
          grep -n "SetBolsterLevel" core/src/game/Entities/Player.h

      - name: Add the Renown module
        shell: bash
        run: |
          cp -r renown-repo/cmangos-renown core/src/modules/renown
          sed -i 's#^MODULES=#RENOWN=https://github.com/${{ github.repository }}.git\nMODULES=#' deps/modules/modules.conf
          cat deps/modules/modules.conf
          grep -q '^RENOWN=' deps/modules/modules.conf

      - name: Install Boost
        uses: MarkusJx/install-boost@v2.5.1
        id: install-boost
        with:
          boost_version: ${{ env.BOOST_VERSION }}
          toolset: ${{ env.BOOST_TOOLSET }}

      - name: Configure
        shell: bash
        env:
          BOOST_ROOT: ${{ steps.install-boost.outputs.BOOST_ROOT }}
        run: |
          W="$(cygpath -m "$GITHUB_WORKSPACE")"
          cmake ${{ env.BUILD_OPTIONS }} \
            -DFETCHCONTENT_SOURCE_DIR_MODULES="$W/deps/modules" \
            -DFETCHCONTENT_SOURCE_DIR_PLAYERBOTS="$W/core/src/modules/playerbots" \
            -DFETCHCONTENT_SOURCE_DIR_IMMERSIVE="$W/core/src/modules/immersive" \
            -DFETCHCONTENT_SOURCE_DIR_HARDCORE="$W/core/src/modules/hardcore" \
            -DFETCHCONTENT_SOURCE_DIR_TRANSMOG="$W/core/src/modules/transmog" \
            -DFETCHCONTENT_SOURCE_DIR_RENOWN="$W/core/src/modules/renown" \
            -B "$W/build" -S "$W/core" 2>&1 | tee cfg.log
          test ${PIPESTATUS[0]} -eq 0

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          cmake --build build --config ${{ env.BUILD_TYPE }} --parallel 4 2>&1 | tee build.log

      - name: Report compile errors
        if: failure()
        shell: bash
        run: |
          if [ -f cfg.log ]; then grep -A4 "CMake Error" cfg.log | head -40 | while IFS= read -r line; do echo "::error::$line"; done; fi
          if [ ! -f build.log ]; then exit 0; fi
          grep -E "error C[0-9]+|error LNK|fatal error" build.log | sort -u | head -40 | while IFS= read -r line; do echo "::error::$line"; done

      - name: Package
        shell: bash
        run: |
          mkdir -p out
          cp -r "build/bin/x64_${{ env.BUILD_TYPE }}/." out/
          find build -name renown.conf.dist -exec cp {} out/ \; || true
          mkdir -p out/sql && cp renown-repo/sql/wotlk/*.sql out/sql/ 2>/dev/null || true
          ls -la out

      - name: Zip build
        shell: bash
        run: 7z a -tzip "mangosd-renown-wotlk-${{ github.run_number }}.zip" ./out/*

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: wotlk-build-${{ github.run_number }}
          name: WotLK server build ${{ github.run_number }}
          body: "mangosd.exe for SPP Classics V2 (WotLK) with the Renown module. Commit ${{ github.sha }}."
          files: mangosd-renown-wotlk-${{ github.run_number }}.zip
          make_latest: false
